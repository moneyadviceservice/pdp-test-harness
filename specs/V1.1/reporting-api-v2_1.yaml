openapi: 3.0.0
info:
  title: Reporting API
  version: '2.1'
  description: |
    The Reporting API for the reporting service of the Money and Pensions Service (MaPS). It is hosted by the CDA.
    This API allows pension providers and schemes to report various performance metrics and service availability data.
    For more details, please refer to the [Reporting Technical Standards](https://www.pensionsdashboardsprogramme.org.uk/standards/reporting-standards).
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/PensionsDashboard/reporting-api/2.1
- description: Local server
  url: https://localhost:8080

tags:
- name: view-response
  description: |
    View response performance metrics including request volumes, response times,
    calculation durations, and unavailability scenarios
- name: service-availability
  description: |
    Service availability monitoring for both find and view services,
    tracking planned and unplanned downtime with precise timestamps

components:
  schemas:
    HoldernameGuidDefinition:
      type: object
      required:
      - holdernameGuid
      properties:
        holdernameGuid:
          type: string
          format: uuid
          description: |
            HoldernameGuid unique identifier associated with one or more parts of regulated pension providers or schemes. 
            see [Link](https://www.pensionsdashboardsprogramme.org.uk/standards/technical-standards) for details 
          example: "816f82b5-8e4f-407b-8c54-afb179c4af5a"

    SubmissionIdDefinition:
      type: object
      required:
      - submission_id
      properties:
        submission_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The submission id is a unique identifier for the batch of records as part of the same 
            data being reported.Submission_id must always be populated for all records. 
            When submission_reason is "null submission" and for any individual record not submitted as part of a batch, submission_id should be null.
          example: "b955b911-838c-4179-bd2f-089630c61a9d"

    GeneralReportingProperties:
      type: object
      required:
      - record_id
      - submission_status
      - reporting_period_start
      properties:
        record_id:
          type: string
          format: uuid
          description: |
            The record_id is a unique identifier for the record for which data is being reported.
            This must be a valid UUID v4 format and is required for all reporting operations.
          example: "3eac3a8b-fbdc-4897-b3ea-908a6b411d7f"
        submission_status:
          type: string
          minLength: 1
          maxLength: 255
          enum:
          - "on time"
          - "correction"
          - "late"
          description: |
            This is the status for this data upload/submission via the reporting api.
          example: "correction"
        reporting_period_start:
          type: string
          format: date-time
          description: |
            Reporting period start for which data was uploaded/submitted via api.
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2025-03-19T00:00:00.000Z"

    SubmissionReasonNullIncluded:
      type: object
      required:
      - submission_reason
      properties:
        submission_reason:
          type: string
          minLength: 1
          maxLength: 255
          enum:
          - "initial submission"
          - "resubmission"
          - "null submission"
          description: |
            List the reason for this data upload/submission via api
          example: "initial submission"

    SubmissionReasonNullNotIncluded:
      type: object
      required:
      - submission_reason
      properties:
        submission_reason:
          type: string
          minLength: 1
          maxLength: 255
          enum:
          - "initial submission"
          - "resubmission"
          description: |
            List the reason for this data upload/submission via api. Null submission is not included in this schema.
          example: "initial submission"

    GenericReportingProperties:
      allOf:
      - $ref: "#/components/schemas/GeneralReportingProperties"
      - $ref: "#/components/schemas/SubmissionReasonNullIncluded"

    GenericReportingPropertiesWithoutNull:
      allOf:
      - $ref: "#/components/schemas/GeneralReportingProperties"
      - $ref: "#/components/schemas/SubmissionReasonNullNotIncluded"

    NullSubmissionData:
      allOf:
      - $ref: "#/components/schemas/HoldernameGuidDefinition"
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/GenericReportingProperties'

    NullSubmissionMultipleHolders:
      allOf:
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/GeneralReportingProperties'
      - $ref: '#/components/schemas/SubmissionReasonNullIncluded'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            minItems: 1
            maxItems: 667
            description: Array of holdernameGuid values for null submission
            items:
              type: string
              format: uuid
              description: Holder GUID for which no data is available
              example: "816f82b5-8e4f-407b-8c54-afb179c4af5a"

    ServiceUnavailabilityData:
      type: object
      required:
      - start_date_ts
      - end_date_ts
      - unavail_scheduled
      - unavail_reason
      properties:
        start_date_ts:
          type: string
          format: date-time
          maxLength: 255
          description: |
            Must report per pension provider or scheme, per calendar month the
            start date and time of each instance of find service unavailability. 
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2021-11-25T00:00:00.000Z"

        end_date_ts:
          type: string
          format: date-time
          maxLength: 255
          description: |
            Must report per pension provider or scheme, per calendar month the 
            end date and time of each instance of find service unavailability. 
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2021-11-25T00:00:00.000Z"

        unavail_scheduled:
          type: boolean
          description: |
            - false: 0-> Unplanned unavailability. 
            - true: 1-> Planned unavailability. 
          example: true

        unavail_reason:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Z0-9_ .-]*$'
          description: |
            Must report reason for unavailability. 
          example: "Downtime for system update"

    HolderNameUnavailabilityMap:
      type: object
      description: |
        A map where each key is a holdernameGuid and the value is an array of service unavailability data for that holdername.
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/components/schemas/ServiceUnavailabilityData'
      example:
        "816f82b5-8e4f-407b-8c54-afb179c4af5a":
        - unavail_scheduled: true
          unavail_reason: "Downtime for system update"
          start_date_ts: "2024-11-25T00:00:00.000Z"
          end_date_ts: "2024-11-25T14:24:01.248Z"
        - unavail_scheduled: true
          unavail_reason: "Downtime for system update"
          start_date_ts: "2024-11-25T00:00:00.000Z"
          end_date_ts: "2024-11-25T14:24:01.248Z"
        "816f82b5-8e4f-407b-8c54-afb179c4af5c":
        - unavail_scheduled: true
          unavail_reason: "Downtime for system update"
          start_date_ts: "2024-11-25T00:00:00.000Z"
          end_date_ts: "2024-11-25T14:24:01.248Z"

    DefaultResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - datetimestamp
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Z0-9_]*$'
          description: message for the response
          example: "ACCEPTED"
        datetimestamp:
          type: string
          format: date-time
          description: |
            Reporting data submission time stamp.
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2021-11-25T00:00:00.000Z"

    RequestDetails:
      type: object
      additionalProperties: false
      required:
      - req_date_ts
      - resp_date_ts
      properties:
        req_date_ts:
          type: string
          format: date-time
          description: |
            The date and time of the view request for each view response that exceeds 10 seconds per pension provider or scheme.
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2021-11-25T00:00:00.000Z"
        resp_date_ts:
          type: string
          format: date-time
          description: |
            The date and time of the view request for each view response that exceeds 10 seconds per pension provider or scheme.
            For more Details see [rfc3339](https://www.rfc-editor.org/rfc/rfc3339#section-5.8)
          example: "2021-11-25T00:00:00.000Z"

    RequestNumber:
      type: object
      required:
      - req_count
      properties:
        req_count:
          type: integer
          format: int32
          minimum: 0
          description: The number of view requests received per pension provider or scheme.
          example: 100

    ResponseTimes:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1400
          items:
            $ref: '#/components/schemas/RequestDetails'

    AccruedUnavailableData:
      type: object
      required:
      - accrued_unavail_ano_count
      - accrued_unavail_ppf_count
      - accrued_unavail_trn_count
      properties:
        accrued_unavail_ano_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.401 (accrued unavailable) as code ‘ANO’. 
          example: 0
        accrued_unavail_ppf_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.401 (accrued unavailable) as code ‘PPF’.   
          example: 0
        accrued_unavail_trn_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.401 (accrued unavailable) as code ‘TRN’.   
          example: 0

    BaseCalculationRequest:
      allOf:
      - $ref: "#/components/schemas/HoldernameGuidDefinition"
      type: object
      required:
      - calculation_type
      properties:
        calculation_type:
          type: string
          minLength: 1
          maxLength: 255
          enum:
          - single
          - multiple
          description: |
            Type of calculation for which data is reported for. 
            which can be single or multiple.
          example: "multiple"

    CalculationObject:
      type: object
      additionalProperties: false
      required:
      - value_code
      - calculation_start_date
      - calculation_end_date
      properties:
        value_code:
          type: string
          minLength: 1
          maxLength: 255
          enum:
          - DBC
          - DCC
          description: |
            Must report per pension provider or scheme, each instance where at least one ERI value is not available for immediate return. For each instance: 
            whether all the benefits for which calculations are required are DC or not (by reporting the unavailable code returned as per the data standards)
            codes ‘[DBC’ and /’DCC’] for data standards 2.301/2.401.). 
          example: DBC
        calculation_start_date:
          type: string
          format: date-time
          description: |
            The calculation time (time taken for the data to be available for return).
            This is expressed in date format consistent with ISO 8601:2004 date format.
          example: "2021-11-15T00:00:00.000Z"
        calculation_end_date:
          type: string
          format: date-time
          description: |
            The calculation time (time taken for the data to be available for return).
            This is expressed in date format consistent with ISO 8601:2004 date format.
          example: "2021-11-25T00:00:00.000Z"

    CalculationDataArray:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 1300
          items:
            $ref: '#/components/schemas/CalculationObject'

    SingleCalculationData:
      type: object
      required:
      - single_calculation
      properties:
        single_calculation:
          $ref: '#/components/schemas/CalculationDataArray'

    MultipleCalculationData:
      type: object
      required:
      - multiple_calculation
      properties:
        multiple_calculation:
          type: object
          additionalProperties: false
          required:
          - eriCalculationData
          - accruedCalculationData
          properties:
            eriCalculationData:
              $ref: '#/components/schemas/CalculationDataArray'
            accruedCalculationData:
              $ref: '#/components/schemas/CalculationDataArray'

    CalculationRequest:
      allOf:
      - $ref: '#/components/schemas/BaseCalculationRequest'
      - $ref: '#/components/schemas/GeneralReportingProperties'
      - $ref: '#/components/schemas/SubmissionReasonNullIncluded'
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - anyOf:
        - $ref: '#/components/schemas/SingleCalculationData'
        - $ref: '#/components/schemas/MultipleCalculationData'
        discriminator:
          propertyName: calculation_type
          mapping:
            single: '#/components/schemas/SingleCalculationData'
            multiple: '#/components/schemas/MultipleCalculationData'

    ViewResponseUnavailable:
      type: object
      required:
      - contact_count
      - missingadmin_count
      - temperror_count
      properties:
        contact_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.004 (contact pension provider or scheme) populated ‘true’. 
            Code to indicate there has been a match but the user should contact the pension provider/scheme 
            before it provides any or all the user’s pensions information.
          example: 12
        missingadmin_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.005 (administrative details not available, new member case) populated ‘true’.   
          example: 0
        temperror_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total view responses item 2.006 (temporary system error) is populated 'true'.  
            Code to explain to the user that some or all of the pensions information is not 
            available due to a temporary system error and they should re-try shortly. 
          example: 0

    EriUnavailableData:
      type: object
      required:
      - eri_unavail_ano_count
      - eri_unavail_ppf_count
      - eri_unavail_trn_count
      properties:
        eri_unavail_ano_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.301 (ERI unavailable) as code ‘ANO’.  
          example: 0

        eri_unavail_ppf_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.301 (ERI unavailable) as code ‘PPF’.   
          example: 0

        eri_unavail_trn_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total count of returns of item 2.301 (ERI unavailable) as code ‘TRN’.   
          example: 0

    NullSubmission:
      $ref: '#/components/schemas/NullSubmissionData'

    ServiceAvailabilityReportData:
      description: |
        Service availability report data for initial submission or resubmission.
        For null submissions (no unavailability data to report), use NullSubmissionMultipleHolders instead.
      allOf:
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/GeneralReportingProperties'
      - $ref: '#/components/schemas/SubmissionReasonNullNotIncluded'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            minItems: 1
            maxItems: 667
            description: |
              Array of holder unavailability data. Each item is a map where the key is a holdernameGuid
              and the value is an array of unavailability periods for that holder.
            items:
              $ref: '#/components/schemas/HolderNameUnavailabilityMap'

    ViewResponseRequestNumberData:
      allOf:
      - $ref: '#/components/schemas/HoldernameGuidDefinition'
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/RequestNumber'
      - $ref: '#/components/schemas/GeneralReportingProperties'
      - $ref: '#/components/schemas/SubmissionReasonNullIncluded'

    ViewResponseResponseTimesData:
      allOf:
      - $ref: '#/components/schemas/HoldernameGuidDefinition'
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/GeneralReportingProperties'
      - $ref: '#/components/schemas/SubmissionReasonNullIncluded'
      - $ref: '#/components/schemas/ResponseTimes'

    ViewResponseUnavailableRequest:
      allOf:
      - $ref: '#/components/schemas/HoldernameGuidDefinition'
      - $ref: '#/components/schemas/SubmissionIdDefinition'
      - $ref: '#/components/schemas/GenericReportingPropertiesWithoutNull'
      - $ref: '#/components/schemas/ViewResponseUnavailable'
      - $ref: '#/components/schemas/EriUnavailableData'
      - $ref: '#/components/schemas/AccruedUnavailableData'

    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - errors
      description: |
        A problem details object compliant with RFC 9457:
        [Link](https://datatracker.ietf.org/doc/html/rfc9457)
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          maxLength: 1024
          description: |
            A URI reference that identifies the problem type.
            see [link](https://datatracker.ietf.org/doc/html/rfc9457#name-type) for details.
          example: "https://example.com/probs/validation-error"
        title:
          type: string
          maxLength: 1024
          description: |
            A short, human-readable summary of the problem type. 
            see [link](https://datatracker.ietf.org/doc/html/rfc9457#name-title) for details.
          example: 'Bad Request'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: |
            The HTTP status code generated by the origin server for this error occurrence.
            see [link](https://datatracker.ietf.org/doc/html/rfc9457#name-status) for details.
          example: 400
        datetimestamp:
          type: string
          format: date-time
          maxLength: 250
          description: |
            ISO 8601 timestamp of when the error occurred. 
          example: "2025-06-26T14:00:00Z"
        as_uri:
          type: string
          format: uri
          maxLength: 2048
          description: |
            A URI used in the context of an error and can provide additional information.
          example: "https://cda.example.com/ig/pat-refresh"
        errors:
          type: array
          maxItems: 1000
          description: |
            Detailed array of errors (extension). Each error item relates to a specific occurrence part of the set of errors 
          items:
            type: object
            additionalProperties: false
            required:
            - code
            properties:
              code:
                type: string
                maxLength: 100
                description: A machine-readable and human understandable code for this occurrence of the problem and defined by MaPS.
                example: "INVALID_X_REQUEST_ID"

  examples:
    BadRequestXRequestIDExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_X_REQUEST_ID"

    BadRequestHoldernameGuidExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_HOLDERNAMEGUID"

    BadRequestRecordIdExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_RECORD_ID"

    BadRequestSubmissionIdExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_SUBMISSION_ID"

    BadRequestSubmissionReasonExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_SUBMISSION_REASON"

    BadRequestReportingPeriodStartExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_REPORTING_PERIOD_START"

    BadRequestUnavailScheduledExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
