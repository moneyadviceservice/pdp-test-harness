        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_VALUE_CODE"

    BadRequestCalculationStartDateExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_CALCULATION_START_DATE"

    BadRequestCalculationEndDateExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_CALCULATION_END_DATE"

    BadRequestContactCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_CONTACT_COUNT"

    BadRequestMissingAdminCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_MISSINGADMIN_COUNT"

    BadRequestTempErrorCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_TEMPERROR_COUNT"

    BadRequestEriUnavailPpfCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_ERI_UNAVAIL_PPF_COUNT"

    BadRequestEriUnavailAnoCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
