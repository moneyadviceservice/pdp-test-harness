    BadRequestUnavailReasonExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_UNAVAIL_REASON"

    BadRequestInvalidStartDateExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_START_DATE_TS"

    BadRequestInvalidEndDateExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_END_DATE_TS"

    BadRequestReqCountExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_REQ_COUNT"

    BadRequestReqDateTsExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_REQ_DATE_TS"

    BadRequestRespDateTsExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
        errors:
        - code: "INVALID_RESP_DATE_TS"

    BadRequestCalculationTypeExample:
      value:
        type: 'https://example.com/probs/bad-request'
        title: "Bad Request"
        status: 400
        datetimestamp: '2025-07-15T00:00:00.000Z'
