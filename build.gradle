buildscript {
	configurations.classpath {
		resolutionStrategy {
			force 'io.swagger.parser.v3:swagger-parser-v3:2.1.36'
		}
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.6'
	id "org.openapi.generator" version "7.17.0"
	id 'jacoco'
}

group = 'uk.org.ca.stub'
version = '2.0.3-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

ext {
	set('commons-lang3.version', '3.20.0')
	set('jackson-bom.version', '2.21.3')         // GHSA-72hv-8253-57qq (8.7 HIGH)
	set('tomcat.version', '10.1.55')             // CVE-2026-24734 (7.5 HIGH)
	set('spring-framework.version', '6.2.18')    // CVE-2026-22737, CVE-2026-22735, CVE-2026-22745, CVE-2026-22741
}

dependencies {
	implementation 'org.apache.httpcomponents.core5:httpcore5:5.3.6'
	implementation( 'org.springframework.boot:spring-boot-starter-web')
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.4'
	implementation ('org.springframework.boot:spring-boot-starter-tomcat')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation ('org.springframework.boot:spring-boot-starter-validation')

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

defaultTasks 'clean', 'build'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

processResources {
	filesMatching('banner.txt') {
		expand(projectVersion: project.version)
	}
}

tasks.withType(JavaCompile).configureEach {
	inputs.files(tasks.named('processResources'))
	options.encoding = "UTF-8"
	options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// issue open due problem using JaCoCo using the Gradle task on ADO: https://github.com/microsoft/azure-pipelines-tasks/issues/16860
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = true
		html.required = true
	}
}

// see https://github.com/OpenAPITools/openapi-generator/tree/master/modules/openapi-generator-gradle-plugin
openApiGenerate {
	generatorName.set("spring")
	inputSpecRootDirectory.set("$rootDir/specs/V1.1")
	outputDir.set("$rootDir/generated")
	apiPackage.set("uk.org.ca.stub.simulator.rest.api")
	invokerPackage.set("uk.org.ca.stub.simulator.invoker")
	modelPackage.set("uk.org.ca.stub.simulator.rest.model")
	generateApiTests.set(true)
	generateModelTests.set(true)

//	`configOptions` depends on the generator (`generatorName`) used. For spring: https://github.com/OpenAPITools/openapi-generator/blob/master/docs/generators/spring.md
	configOptions.set([
			useSpringBoot3: 'true',
			configPackage: 'uk.org.ca.stub.simulator.configuration',
			interfaceOnly: 'true',
			openApiNullable: 'false'
	])
}

jar {
	// disable generation of **--plain.jar
	enabled = false
	archiveFileName = bootJar.archiveFileName
}

springBoot {
	buildInfo()
}
compileJava.dependsOn(bootBuildInfo)
